<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CareKiln · layout inspection</title><style>body{margin:0;font:12px system-ui;background:#242424;color:#fff}header{padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:#242424;z-index:2}label{display:flex;align-items:center;gap:7px}select,button{font:12px system-ui;padding:8px;border:1px solid #777;border-radius:3px;background:#fff;color:#111}output{display:block;padding:10px 18px;background:#131313;white-space:pre-wrap;font:11px monospace}#view{overflow:auto;padding:15px;max-width:100%;}#scale{transform-origin:0 0;}iframe{display:block;border:0;background:#f8f5ee}#results{font:11px monospace;white-space:pre-wrap;margin:16px;line-height:1.5}</style><header><b>CareKiln / QA</b><label>Viewport<select id="size"><option value="1440,900">1440 × 900</option><option value="1280,800">1280 × 800</option><option value="775,804">775 × 804</option><option value="768,1024">768 × 1024</option><option value="390,844">390 × 844</option><option value="320,740">320 × 740</option></select></label><label>Page<select id="route"><option>/</option><option>/products</option><option>/products/visit-desk</option><option>/products/visit-review</option><option>/products/visit-proof</option><option>/products/visit-signal</option><option>/products/visit-report</option><option>/how-it-works</option><option>/preview</option><option>/use-cases</option><option>/ecosystem</option><option>/evaluation</option><option>/pilot</option><option>/governance</option><option>/company</option><option>/request-pilot</option><option>/contact</option><option>/sign-in</option><option>/legal/privacy</option><option>/legal/terms</option><option>/accessibility</option><option>/missing-page</option></select></label><button id="intro-fresh">Fresh intro</button><button id="intro-reduced">Reduced motion</button><button id="intro-fail">Failed assets</button><button id="intro-pause">Pause intro</button><button id="intro-skip">Skip intro</button><button id="bounds">Check layout</button><button id="bridge">Bridge</button><button id="story">Show story</button><button id="modules">Show modules</button><button id="first-card">First card</button><button id="signal-card">Signal card</button><button id="top">Top</button><button id="down">Scroll +500</button><button id="up">Scroll −500</button><button id="matrix">Audit all routes</button></header><output id="report">Loading…</output><div id="view"><div id="scale"><iframe id="frame" title="CareKiln viewport preview" src="/"></iframe></div></div><div id="results"></div><script>
const frame=document.querySelector('#frame'),size=document.querySelector('#size'),route=document.querySelector('#route'),report=document.querySelector('#report'),scale=document.querySelector('#scale'),view=document.querySelector('#view');
function resize(){const[w,h]=size.value.split(',').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';const s=Math.min(1,(window.innerWidth-30)/w,(window.innerHeight-145)/h);scale.style.transform='scale('+s+')';scale.style.width=w+'px';scale.style.height=(h*s)+'px';view.style.height=(h*s+30)+'px';}
function data(){const d=frame.contentDocument,w=frame.contentWindow;const moduleCards=[...d.querySelectorAll('.module-card')].map(c=>{const label=c.querySelector('.module-disclosure'),copy=c.querySelector('.module-copy'),art=c.querySelector('.module-art');if(!label)return null;const bottom=Math.max(...[...art.querySelectorAll('.mini-window,.mini-float,.match-options,.match-destination,.hours-meter,.signal-review,.message-preview')].map(e=>e.getBoundingClientRect().bottom));return {card:c.className,labelGap:Math.round(label.getBoundingClientRect().top-bottom),copyGap:Math.round(copy.getBoundingClientRect().top-label.getBoundingClientRect().bottom)};});const time=d.querySelector('.bridge-time')?.getBoundingClientRect(), travel=d.querySelector('.travel-thread')?.getBoundingClientRect();return{intro:{phase:d.querySelector('.intro-film')?.dataset.introPhase||'complete',navOpacity:w.getComputedStyle(d.querySelector('.nav')).opacity,inert:d.querySelector('.site-experience')?.hasAttribute('inert'),overflowLock:d.documentElement.style.overflow,focus:d.activeElement?.tagName,progress:d.querySelector('.intro-progress span')?.style.scale},bridgeRects:[...d.querySelectorAll('.bridge-visual,.travel-thread,.travel-chip-c')].map(e=>({cls:e.className,left:e.getBoundingClientRect().left,width:e.getBoundingClientRect().width,right:e.getBoundingClientRect().right})),bridgeGap:time&&travel?Math.round(travel.top-time.bottom):null,moduleCards,proofLabelGap:d.querySelector(".proof-disclosure")?Math.round(d.querySelector(".proof-disclosure").getBoundingClientRect().top-d.querySelector(".module-card-2 .hours-meter").getBoundingClientRect().bottom):null,page:w.location.pathname,viewport:w.innerWidth+' × '+w.innerHeight,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,pin:!!d.querySelector('.pin-spacer'),pinTop:d.querySelector('.story-stage')?Math.round(d.querySelector('.story-stage').getBoundingClientRect().top):null,step:d.querySelector('.story-tabs .selected')?.textContent||null,motion:d.documentElement.dataset.motion,brokenImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).length,h1:d.querySelectorAll('h1').length,nav:d.querySelector('.nav')?.getBoundingClientRect().height,approval:d.querySelector('.decision-live')?.textContent||d.querySelector('.review-feedback')?.textContent||null};}
function check(){report.textContent=JSON.stringify(data());}
resize();size.onchange=()=>{resize();setTimeout(check,500)};route.onchange=()=>frame.src=route.value;frame.onload=()=>{frame.contentDocument.fonts.ready.then(()=>setTimeout(check,700));};window.onresize=resize;document.querySelector('#bounds').onclick=check;
document.querySelector('#story').onclick=()=>{const e=frame.contentDocument.querySelector('#the-story');if(e)frame.contentWindow.scrollTo({top:e.getBoundingClientRect().top+frame.contentWindow.scrollY-100,behavior:'instant'});setTimeout(check,500)};document.querySelector('#modules').onclick=()=>{const e=frame.contentDocument.querySelector('#modules');if(e)frame.contentWindow.scrollTo({top:e.getBoundingClientRect().top+frame.contentWindow.scrollY-100,behavior:'instant'});setTimeout(check,500)};document.querySelector('#top').onclick=()=>{frame.contentWindow.scrollTo({top:0,behavior:'instant'});check();};document.querySelector('#down').onclick=()=>{frame.contentWindow.scrollBy({top:500,behavior:'instant'});setTimeout(check,200)};document.querySelector('#up').onclick=()=>{frame.contentWindow.scrollBy({top:-500,behavior:'instant'});setTimeout(check,200)};
for(const [id,selector] of [['bridge','.bridge-section'],['first-card','.module-card-0'],['signal-card','.module-card-3']])document.getElementById(id).onclick=()=>{const e=frame.contentDocument.querySelector(selector);if(e)frame.contentWindow.scrollTo({top:e.getBoundingClientRect().top+frame.contentWindow.scrollY-90,behavior:'instant'});setTimeout(check,300);};
document.querySelector('#matrix').onclick=async()=>{const out=document.querySelector('#results');out.textContent='Running visible iframe layout audit…';const results=[];for(const viewport of ['1440,900','768,1024','390,844','320,740']){size.value=viewport;resize();for(const opt of route.options){route.value=opt.value;await new Promise(resolve=>{frame.onload=()=>frame.contentDocument.fonts.ready.then(()=>setTimeout(resolve,200));frame.src=opt.value;});const row=data();results.push(row);report.textContent='Auditing '+row.page+' at '+row.viewport;}}out.textContent=JSON.stringify({checked:results.length,failures:results.filter(r=>r.overflow||r.brokenImages||r.h1!==1),rows:results},null,2);report.textContent='Audit complete: '+results.length+' route/viewport combinations.';frame.onload=()=>frame.contentDocument.fonts.ready.then(()=>setTimeout(check,700));};
for(const [id,suffix] of [['intro-fresh','fresh=1'],['intro-reduced','fresh=1&reduced=1'],['intro-fail','fresh=1&fail=1']])document.getElementById(id).onclick=()=>frame.src='/intro-test.html?'+suffix;document.getElementById('intro-pause').onclick=()=>frame.contentDocument.querySelector('.intro-actions button')?.click();document.getElementById('intro-skip').onclick=()=>frame.contentDocument.querySelector('.intro-actions button:last-child')?.click();
</script></html>
